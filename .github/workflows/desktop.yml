name: Build Windows desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-desktop.lock
      - name: Check release version
        if: github.ref_type == 'tag'
        run: python -c "from scripts.build_desktop import VERSION; import os; assert os.environ['GITHUB_REF_NAME'] == 'v' + VERSION, 'Release tag must match desktop version'"
      - run: ./scripts/prepare_desktop_tools.ps1
      - run: python scripts/build_desktop.py --iscc .local/desktop-build/tools/inno/ISCC.exe
        env:
          PYTHONUTF8: '1'
      - name: Verify frozen application
        shell: pwsh
        run: |
          $resultPath = Join-Path $pwd '.local/desktop-build/smoke.json'
          $process = Start-Process -FilePath '.local/desktop-build/dist/Yijian/Yijian.exe' -ArgumentList @('--smoke-test', '--result', ('"' + $resultPath + '"')) -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Desktop smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Desktop smoke test failed' }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.model_ready) { throw 'Desktop resources are not ready' }
          & '.local/desktop-build/dist/Yijian/yijian-cli.exe' --help
          if ($LASTEXITCODE -ne 0) { throw 'Assistant CLI failed' }
      - name: Verify image processing and data roundtrip
        run: python scripts/verify_desktop_bundle.py .local/desktop-build/dist/Yijian/Yijian.exe --result .local/desktop-build/roundtrip.json
        env:
          PYTHONUTF8: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: Yijian-windows-x64
          path: .local/desktop-build/release/*
          if-no-files-found: error
